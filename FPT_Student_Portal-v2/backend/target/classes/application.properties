server.port=${PORT:8086}
server.address=0.0.0.0
access.db.path=${ACCESS_DB_PATH:../FPT_Student_Portal.accdb}
# Infer slots from session start time; configurable when campus periods differ.
timetable.slot-windows=${TIMETABLE_SLOT_WINDOWS:07:30-09:50,10:00-12:20,12:50-15:10,15:20-17:40}
demo.enabled=${DEMO_ENABLED:false}
demo.email=${DEMO_EMAIL:demo.student@example.com}
demo.password=${DEMO_PASSWORD:}
spring.jackson.serialization.write-dates-as-timestamps=false

# OAuth Web Client ID registered in Google Cloud (must match Flutter)
google.web.client-id=${GOOGLE_WEB_CLIENT_ID:}
